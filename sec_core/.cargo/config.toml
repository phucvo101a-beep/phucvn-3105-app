[target.aarch64-apple-ios]
rustflags = [
    "-C", "link-arg=-Wl,-x",
    "-C", "link-arg=-Wl,-dead_strip",
    "-C", "link-arg=-framework",
    "-C", "link-arg=Security",
    "-C", "link-arg=-framework",
    "-C", "link-arg=CoreFoundation"
]

[target.x86_64-apple-ios]
rustflags = [
    "-C", "link-arg=-framework",
    "-C", "link-arg=Security",
    "-C", "link-arg=-framework",
    "-C", "link-arg=CoreFoundation"
]
