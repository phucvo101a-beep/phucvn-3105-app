[package]
name = "sec_core"
version = "3.0.0"
edition = "2021"
description = "Zero-Trust Security, Anti-Tamper, Control-Flow & Encrypted Auth Core for 3105"

[lib]
name = "sec_core"
crate-type = ["cdylib"]

[dependencies]
# Cryptography & Secure Memory Zeroization
zeroize = { version = "1.8", features = ["derive"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
subtle = "2.5"
rand = "0.8"
hex = "0.4"
base64 = "0.22"

# Compile-time String Obfuscation
obfstr = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Embedded TLS with SPKI Certificate Pinning (no system proxy reliance)
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }

# Native FFI libc helpers
libc = "0.2"

# Pure-Rust RemotePairing / RemoteXPC HTTP2 / CDTunnel / Userspace TCP
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "net", "time", "sync", "macros"] }
jktcp = { version = "0.1.8", default-features = false }
futures = "0.3"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha1 = "0.10"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
