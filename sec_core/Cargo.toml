[package]
name = "sec_core"
version = "2.0.0"
edition = "2021"
authors = ["PhucVN AppSec"]

[lib]
name = "sec_core"
crate-type = ["cdylib"]

[dependencies]
# Memory wiping on drop
zeroize = { version = "1.8", features = ["derive"] }

# Cryptography (pure-Rust, cross-platform)
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets"] }
ed25519-dalek = { version = "2.1", default-features = false }
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
hkdf = "0.12"
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }

# Compile-time string obfuscation
obfstr = "0.4"

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# TLS & Networking without iOS CFNetwork/NSURLSession
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.7"
ring = "0.17"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
overflow-checks = false
incremental = false
